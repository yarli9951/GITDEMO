on: workflow_dispatch
jobs:
  Javamultiversion:
      strategy:
        matrix:
           java: [ java-version ]
           version: [ 16 , 17 ]
      runs-on: ubuntu-latest
      steps:
        - uses: actions/setup-java@v3
          with:
             java-version: ${{ matrix.version }}
             distribution: 'temurin'
             cache: maven
        - name: Build with maven
          run: | 
            mvn -B package --file pom.xml         
           
