name: mavenbuild
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.java.java-version }}
    steps:
     - uses: actions/checkout@v4
     - name: java
       uses: actions/setup-java@v3
       with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
     - name: Build with maven
       run: | 
            mvn -B package --file pom.xml
     - name: upload jar
       uses: actions/upload-artifact@v4
       with:
         name: jarfile
         path: |
             target
             Windows-1.0-SNAPSHOT.jar
     - name: list
       run: ls -lrt
      


  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v4
     - name: Set up JDK 17
       uses: actions/setup-java@v3
       with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
     - name: Build with maven
       run: | 
            mvn -B install --file pom.xml

  
